/* ================= 数据层：只读对客端两键；配置键 ADMIN_KEY 由本端独占写（写权分离防 tick 竞态） ================= */
const STORE_KEY="gpu-market-demo-v1";
/* 与用户端 index.html 同口径的 ledger 裁剪（2026-09-20）：seed 行（hostV:3/seedTenant）豁免窗口裁剪，
   普通行最老先裁——离线直写合并若裸 slice(0,42) 会把用户端存档里的 seed 流水裁掉。 */
const trimLedger=(a,cap=300)=>{ a=[...a]; let rest=a.filter(e=>!(e.hostV===3||e.seedTenant)).length; while(rest>cap){ const i=a.findLastIndex(e=>!(e.hostV===3||e.seedTenant)); if(i<0) break; a.splice(i,1); rest--; } return a; };
const ACCOUNTS_KEY="gpu-market-accounts-v1";
const ADMIN_KEY="gpu-market-admin-v1";
/* ================= 企业需求线索（enterprise.html 提交落盘；单条一独立键——键级原子追加，规避多 tab 读改写覆盖竞态。
   写权分相：创建瞬间由 enterprise.html 独占写，受理后仅本端写该键。
   ⚠ 本页为无鉴权公开演示页：lead 含真实 PII（邮箱/公司/联系人）；真实流量上线前须随鉴权一起关闭公开读 ================= */

const loadLead=(ref)=>{ try{ return JSON.parse(localStorage.getItem(LEAD_PREFIX+ref))||null }catch(e){ return null } };
const saveLead=(rec)=>{ try{ localStorage.setItem(LEAD_PREFIX+rec.ref,JSON.stringify(rec)) }catch(e){} };
const listLeads=()=>{ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&k.startsWith(LEAD_PREFIX)){ try{ const r=JSON.parse(localStorage.getItem(k)); if(r&&r.ref) out.push(r); }catch(e){} } } }catch(e){}
  // at 降序 + ref 次键（同毫秒提交排序稳定）；待联系置顶在展示层做
  out.sort((a,b)=>((b.at||0)-(a.at||0))||(a.ref<b.ref?-1:1)); return out; };

const loadAdminCfg=()=>{ try{ return JSON.parse(localStorage.getItem(ADMIN_KEY))||{} }catch(e){ return {} } };
const saveAdminCfg=(c)=>{ try{ localStorage.setItem(ADMIN_KEY,JSON.stringify(c)) }catch(e){} };
const defaultCfg=()=>({v:1, commission:0, transitionStorageFee:true, delisted:[], banned:[], approved:[], forceStops:[], backup:null, audit:[], payouts:{approved:[],rejected:[]}});

const send=(msg)=>{ try{ _BC&&_BC.postMessage(msg) }catch(e){} };

const fmtNeg=(n)=>{ if(n==null||isNaN(n)) return "—"; return "-$"+Math.abs(+(n)).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const fmtT=(t)=>{ if(t==null) return "—"; if(t<0) return "底数前";
  const s=Math.floor(t), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h>0? h+"h "+m+"m " : m>0? m+"m " : "")+x+"s"; };

/* ================= 派生数据 ================= */
function derive(store, accounts, cfg){
  const st = { escrow:0, hostEarnings:0, balance:0, ...(store||{}) }; // 注入最小对象时缺失字段按 0 兜底（用户端加载同口径补默认值）
  const instances = Array.isArray(st.instances)? st.instances : [];
  const ledger = Array.isArray(st.ledger)? st.ledger : [];
  const machines = Array.isArray(st.hostMachines)? st.hostMachines : [];
  // 在架供给（对齐对客端 allSupply 口径：12 静态 + 非离线宿主机，再扣 Admin 下架）
  const delisted=(cfg.delisted||[]).map(String);
  const supply=[ ...OFFERS_SUMMARY.map(o=>({id:o.id, source:"offer"})),
    ...machines.filter(m=>!["offline","removed","maintenance"].includes(m.status)).map(m=>({id:"host-"+m.id, source:m.seed?"seed":"host"})) ];
  const supplyLive = supply.filter(o=>!delisted.includes(String(o.id))).length;
  const active = instances.filter(i=>ACTIVE_STATES.includes(i.status));
  // 租客消费总额：仅计真实消费键（排除充值/退款/订单预付划款，避免口径虚高）
  const CONSUME=new Set(["lgGpu","lgStoreStop","lgBw","lgAmort"]);
  const spend = ledger.filter(e=>CONSUME.has(e.msgKey)).reduce((a,e)=>a+(e.amt||0),0);
  const hostGross = ledger.filter(e=>e.hostEarn&&e.amt>0);
  const hostNet = hostGross.reduce((a,e)=>a+e.amt*(1-(e.rate||0)),0);
  const platRev = hostGross.reduce((a,e)=>a+e.amt*(e.rate||0),0);
  const posRate = hostGross.filter(e=>(e.rate||0)>0).length, zeroRate = hostGross.length-posRate;
  const reconDiff = Math.abs(hostGross.reduce((a,e)=>a+e.amt,0) - (hostNet+platRev));
  // 审核队列：非 seed、listed、未被 Admin 通过过
  const approved=(cfg.approved||[]);
  const queue = machines.filter(m=>!m.seed && m.status==="listed" && !approved.includes(m.id));
  const emails = Object.keys(accounts||{});
  const payoutReqs = Array.isArray(st.payoutReqs)? st.payoutReqs : []; // 出金申请（用户端落盘，本端只读）
  return { st, instances, ledger, machines, supplyLive, active, spend, hostGross, hostNet, platRev, posRate, zeroRate, reconDiff, queue, emails, delisted, payoutReqs };
}

function Fund({d,cfg,act}){
  const ratePct=Math.round((cfg.commission||0)*100);
  const [draft,setDraft]=useState(ratePct);
  useEffect(()=>setDraft(ratePct),[ratePct]);
  const ok=d.reconDiff<=0.011;
  // 出金审批派生：待审 = 用户端 pending 且本端账本未批/未驳（用户端离线时已批申请由挂载重放补扣，不再重复展示）
  const poCfg=cfg.payouts||{approved:[],rejected:[]};
  const _done=new Set([...poCfg.approved,...poCfg.rejected].map(x=>x.id));
  const pending=d.payoutReqs.filter(q=>q.status==="pending"&&!_done.has(q.id));
  const totalOut=poCfg.approved.reduce((a,x)=>a+(x.amt||0),0);
  return (<div className="space-y-6">
    <div className="grid gap-5 xl:grid-cols-2">
      <div className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6">

        <input type="range" min="0" max="20" step="1" value={draft} onChange={e=>setDraft(+e.target.value)} className="mt-3 w-full" aria-label={T.fCommission}/>
        <div className="mt-1 flex justify-between text-[13px] text-[var(--color-text-faint)]"><span>0%</span><span>20%</span></div>
        <p className="mt-2 text-[13px] leading-snug text-[var(--color-text-muted)]">{T.fCommissionTip}</p>
        <div className="mt-3"><Btn tone="ok" disabled={draft===ratePct} onClick={()=>act.setCommission(draft)}>{T.fApply}</Btn></div>
      </div>
      <div className="grid grid-cols-2 gap-5">
        <Card label={T.reconRent} value={fmt$(d.hostGross.reduce((a,e)=>a+e.amt,0))}/>
        <Card label={T.reconHost} value={fmt$(d.hostNet)} cls="text-[var(--color-warning)]"/>
        <Card label={T.reconPlat} value={fmt$(d.platRev)} cls="text-[var(--color-accent-on-tint)]"/>
        <Card label={T.reconCheck} size="sm" value={(ok? "✓ " : "✗ ")+(ok? T.reconOk : T.reconErr+" "+d.reconDiff.toFixed(4))} cls={ok?"text-[var(--color-success)]":"text-[var(--color-error)]"} sub={T.reconSplit(d.posRate,d.zeroRate)} live/>
      </div>
    </div>

      <div className="flex flex-wrap items-center justify-between gap-4">
        <div>
          <div className="text-[14px] font-semibold">{T.fTransFee}: <span className={`mono ${cfg.transitionStorageFee!==false?"text-[var(--color-success)]":"text-[var(--color-text-muted)]"}`}>{cfg.transitionStorageFee!==false? T.fTransFeeOn : T.fTransFeeOff}</span></div>
          <p className="mt-1 max-w-3xl text-[13px] leading-snug text-[var(--color-text-muted)]">{T.fTransFeeTip}</p>

        <button type="button" role="switch" aria-checked={cfg.transitionStorageFee!==false} aria-label={T.fTransFee} onClick={()=>act.setTransFee(cfg.transitionStorageFee===false)}

          <span className={`absolute top-1 h-5 w-5 rounded-full bg-white shadow transition-[left,right] ${cfg.transitionStorageFee!==false?"right-1":"left-1"}`}></span>

        <caption className="sr-only">{T.reconTitle}</caption>
        <thead><tr><Th>{T.colTime}</Th><Th>{T.colItem}</Th><Th>{T.colId}</Th><Th cls="text-right">{T.colAmt}</Th><Th>{T.colTag}</Th><Th cls="text-right">{T.colRate}</Th></tr></thead>
        <tbody>{d.ledger.map((e,i)=>(
          <tr key={i}>
            <Td cls="mono text-[var(--color-text-muted)]">{fmtT(e.t)}</Td>
            <Td>{EVT[e.msgKey]? EVT[e.msgKey][_LANG] : e.msgKey}</Td>
            <Td cls="mono text-[var(--color-text-faint)]">{e.sid||"—"}</Td>
            <Td cls={`mono text-right ${e.amt>0?"text-[var(--color-error)]":"text-[var(--color-text-secondary)]"}`}>{fmtNeg(e.amt)}</Td>
            <Td>{e.hostEarn? <span className="rounded border border-[var(--color-warning)]/40 px-1.5 py-px text-[12px] text-[var(--color-warning)]">hostEarn{e.legacy?" · legacy":""}</span>:null}</Td>
            <Td cls="mono text-right">{e.hostEarn? ((e.rate||0)*100).toFixed(0)+"%" : "—"}</Td>

  </div>);

/* ================= 企业需求（enterprise.html 提交的线索漏斗管理） ================= */
function EntLeads({act,leads}){
  const [openRef,setOpenRef]=useState(null);
  const dlgRef=useRef(null);
  // 弹窗打开即移焦入内（键盘可达性最小修；focus trap 属原型豁免）
  useEffect(()=>{ if(openRef) dlgRef.current?.focus(); },[openRef]);
  const [noteDraft,setNoteDraft]=useState("");   // 跟进输入必须组件 state：0.5s 轮询重渲染不得冲掉未提交输入
  const [lostReason,setLostReason]=useState("");
  const [wonArm,setWonArm]=useState(false);   // won 二段确认：唯一不可逆终态，与 lost 双闸对称
  const tlRef=useRef(null);                    // 时间线列表容器：输入框在流末尾，提交后把新条目（头部）滚回视野
  const cur=leads.find(l=>l.ref===openRef)||null;
  useEffect(()=>{ const onKey=e=>{ if(e.key==="Escape") setOpenRef(null); }; window.addEventListener("keydown",onKey); return ()=>window.removeEventListener("keydown",onKey); },[]);
  const open=(l)=>{ setOpenRef(l.ref); setNoteDraft(""); setLostReason(""); setWonArm(false); };
  const close=()=>setOpenRef(null);
  const stName=(s)=>LEAD_STATUSES.includes(s)? T["elSt"+s[0].toUpperCase()+s.slice(1)] : (s||"—");
  const counts={}; LEAD_STATUSES.forEach(s=>{ counts[s]=leads.filter(l=>l.status===s).length; });
  // 待联系组置顶（组内时间倒序），其余组时间倒序
  const sorted=[...leads].sort((a,b)=>((a.status==="new"?0:1)-(b.status==="new"?0:1))||((b.at||0)-(a.at||0)));
  const move=(to)=>{ if(!cur) return; if(to==="lost"&&!lostReason) return; act.leadStatus(cur,to,to==="lost"?lostReason:null); setLostReason(""); setWonArm(false); };
  const addNote=()=>{ const tx=noteDraft.trim(); if(!tx||!cur) return; act.leadNote(cur,tx); setNoteDraft(""); if(tlRef.current) tlRef.current.scrollTop=0; };
  return (<div className="space-y-6">
    {/* 概览只留三个有决策含义的数：待联系=行动量；处理中/已闭环=漏斗压缩（逐状态明细在列表徽章，不重复展示） */}
    <div className="grid grid-cols-1 gap-5 sm:grid-cols-3">
      <Card label={T.elStNew} value={counts.new} cls="text-[var(--color-warning)]"/>
      <Card label={T.elCardDoing} value={counts.contacted+counts.proposal}/>
      <Card label={T.elCardDone} value={counts.won+counts.lost}/>
    </div>
    <div className="overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]">
      {sorted.length===0? (
      <div className="px-5 py-10 text-[14px] text-[var(--color-text-faint)]">
        {T.elEmpty}
        <div className="mt-3"><Btn tone="ok" onClick={()=>act.inject()}>{T.genBtn}</Btn></div>
        <p className="mt-2 text-[12px]">{T.elEmptyInjectHint}</p>
      </div>
      ) : (
      <div className="table-scroll">
      <table className="w-full text-[14px]">
        <caption className="sr-only">{T.navEnt}</caption>
        {/* 列表=分拣视图，只放必有值的列（必填字段填充率 100%，选填的公司/预算留弹窗——空「—」会让列表显残缺）；
            邮箱恒有故作主行（姓名选填作副行）；周期并入概要凑齐「型号×卡数·周期」画像 */}
        <thead><tr><Th>{T.elColContact}</Th><Th cls="whitespace-nowrap">{T.colTime}</Th><Th cls="whitespace-nowrap">{T.elColReq}</Th><Th cls="whitespace-nowrap">{T.elColStatus}</Th><Th cls="whitespace-nowrap">{T.colAct}</Th></tr></thead>
        <tbody>{sorted.map(l=>{
          const done=l.status==="won"||l.status==="lost";
          return (
          <tr key={l.ref} className="hover:bg-[var(--color-surface-alt)]">
            {/* 邮箱列限宽截断：超长企业邮箱（25ch+ 常态）会把操作列挤出容器；max-w 必须加在内层 div（td 上的 max-width 在 table-auto 下不可靠），全文在详情弹窗可复制 */}
            <Td><div className="mono max-w-[11rem] truncate" title={l.draft?.email||""}>{l.draft?.email||T.none}</div>{l.draft?.name? <div className="max-w-[11rem] truncate text-[12px] text-[var(--color-text-faint)]" title={l.draft.name}>{l.draft.name}</div>:null}</Td>
            <Td cls="mono whitespace-nowrap text-[13px] text-[var(--color-text-faint)]">{fmtShort(l.at)}</Td>
            <Td cls="whitespace-nowrap">{(T.elGpus[l.draft?.gpu]||l.draft?.gpu||T.none)+(l.draft?.cards?` × ${l.draft.cards}`:"")+(l.draft?.period? ` · ${T.elPeriods[l.draft.period]||l.draft.period}`:"")}</Td>
            <Td cls="whitespace-nowrap"><span className={`rounded border px-1.5 py-px text-[12px] ${LEAD_CLS[l.status]||""}`}>{stName(l.status)}</span></Td>
            {/* 操作列＝唯一详情入口（一元素一职责：行不可点，避免同动作双元素）；非终态用 accent 色调传达「待我处理」 */}
            <Td cls="whitespace-nowrap">{done
              ? <Btn tone="plain" label={T.elActView+" "+l.ref} onClick={()=>open(l)}>{T.elActView}</Btn>
              : <Btn tone="plain" label={T.elActFollow+" "+l.ref} cls="border-[var(--color-accent)]/40 text-[var(--color-accent-on-tint)] hover:bg-[var(--color-accent)]/10" onClick={()=>open(l)}>{T.elActFollow} <span aria-hidden="true">›</span></Btn>}</Td>
          </tr>);})}
        </tbody>
      </table>
      </div>)}
    </div>
    {cur && (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={close}>
      <div role="dialog" aria-modal="true" aria-label={T.elDetail} tabIndex={-1} ref={dlgRef}
        className="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-2xl outline-none"
        onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between gap-4">
          <div>
            <div className="mono text-[13px] text-[var(--color-text-faint)]">{cur.ref}</div>
            <h2 className="mt-0.5 text-[18px] font-bold tracking-tight">{cur.draft?.company||T.elDetail}</h2>
            <span className={`mt-2 inline-block rounded border px-1.5 py-px text-[12px] ${LEAD_CLS[cur.status]||""}`}>{stName(cur.status)}</span>
          </div>
          <button onClick={close} aria-label={T.elClose}
            className="btn-touch rounded-md border border-[var(--color-border)] px-2 text-[14px] text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]">✕</button>
        </div>
        {/* 字段区：联系方式提首（留言板核心动作＝拿到联系方式，邮箱 mailto 一步直达）；
            mono 只给代号/数字/时间/邮箱，中文枚举值回正文字体（mono 的职能是可机读感，中文无此需求） */}
        <dl className="mt-4 grid grid-cols-2 gap-x-6 gap-y-3 text-[14px] md:grid-cols-3">
          {[[T.elFName,cur.draft?.name||T.none,""],
            [T.elFEmail,cur.draft?.email||T.none,"mono email"],
            [T.elFModel,(T.elModels[cur.draft?.model]||cur.draft?.model||T.none)+((cur.draft?.model==="other"&&cur.draft?.modelOther)?`（${cur.draft.modelOther}）`:""),""],
            [T.elFGpu,T.elGpus[cur.draft?.gpu]||cur.draft?.gpu||T.none,"mono"],
            [T.elFCards,cur.draft?.cards?`${cur.draft.cards} GPU`:T.none,"mono"],
            [T.elFPeriod,T.elPeriods[cur.draft?.period]||cur.draft?.period||T.none,""],
            [T.elFBudget,cur.draft?.budget||T.none,"mono"],
            [T.elFAt,fmtDate(cur.at),"mono"],
          ].map(([k,v,kind],i)=>(
            <div key={i}><dt className="text-[12px] text-[var(--color-text-faint)]">{k}</dt><dd className={`mt-0.5 break-all text-[14px] ${kind.includes("mono")?"mono":""}`}>{kind.includes("email")&&cur.draft?.email
              ? <a className="text-[var(--color-accent-on-tint)] hover:underline" href={`mailto:${cur.draft.email}`}>{v}</a>
              : v}</dd></div>))}
        </dl>
        {cur.draft?.note && (
        <div className="mt-4 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface-alt)] p-3 text-[13px] leading-5">
          <span className="text-[12px] text-[var(--color-text-faint)]">{T.elFNote}：</span>{cur.draft.note}
        </div>)}
        <div className="mt-5 border-t border-[var(--color-border)] pt-4">
          <div className="text-[13px] font-semibold text-[var(--color-text-secondary)]">{T.elMove}</div>
          {cur.status==="won" ? <p className="mt-2 text-[13px] text-[var(--color-text-faint)]">{T.elWonTip}</p> : (
          <div className="mt-2 flex flex-wrap items-center gap-2">
            {LEAD_STATUSES.filter(s=>s!==cur.status&&s!=="lost").map(s=>{
              // 正向迁移低危可逆、直接生效；won 例外——唯一不可逆终态，首点武装、再点生效、失焦复位（与 lost 选因+确认双闸对称）
              if(s!=="won") return <Btn key={s} tone="plain" onClick={()=>move(s)}>{stName(s)}</Btn>;
              return <Btn key={s} tone="ok" title={T.elWonArmTip} onClick={()=>wonArm? move("won"):setWonArm(true)} onBlur={()=>setWonArm(false)}>{wonArm? T.elWonArm:stName(s)}</Btn>;
            })}
          </div>)}
          {cur.status!=="won" && (
          <div className="mt-2 flex flex-wrap items-center gap-2">
            <select value={lostReason} onChange={e=>setLostReason(e.target.value)} aria-label={T.elLostReason}
              className="min-h-[44px] min-w-[10rem] rounded-md border border-[var(--color-border-strong)] bg-[var(--color-surface)] px-2 py-1.5 text-[13px]">
              <option value="">{T.elLostReason}…</option>
              {Object.entries(T.elLostR).map(([k,v])=><option key={k} value={k}>{v}</option>)}
            </select>
            <Btn tone="danger" disabled={!lostReason} title={T.elLostReq} onClick={()=>move("lost")}>{T.elConfirmLost}</Btn>
          </div>)}
        </div>
        <div className="mt-5 border-t border-[var(--color-border)] pt-4">
          <div className="text-[13px] font-semibold text-[var(--color-text-secondary)]">{T.elTimeline}</div>
          {/* 先读后写（回看是高频场景，记录在流末尾）；列表限高内部滚动，弹窗高度不随条目数增长 */}
          {(cur.timeline||[]).length===0? <p className="mt-2 text-[13px] text-[var(--color-text-faint)]">{T.elTimelineEmpty}</p> : (
          <ol ref={tlRef} className="mt-2 max-h-60 space-y-2 overflow-y-auto pr-1">
            {cur.timeline.map((e,i)=>(
              <li key={i} className="flex gap-2.5 text-[13px] leading-5">
                <span className="mono shrink-0 text-[12px] text-[var(--color-text-faint)]">{fmtDate(e.t)}</span>
                <span>{e.type==="status"
                  ? <span><span className="font-medium">{stName(e.from)} → {stName(e.to)}</span>{e.reason? <span className="text-[var(--color-text-faint)]"> · {T.elLostR[e.reason]||e.reason}</span>:null}</span>
                  : e.text}</span>
              </li>))}
          </ol>)}
          <div className="mt-3 flex gap-2">
            <input value={noteDraft} onChange={e=>setNoteDraft(e.target.value)} placeholder={T.elNotePh} aria-label={T.elNoteAdd}
              onKeyDown={e=>{ if(e.key==="Enter") addNote(); }}
              className="min-h-[44px] min-w-0 flex-1 rounded-md border border-[var(--color-border-strong)] bg-[var(--color-surface)] px-2.5 py-1.5 text-[13px] outline-none focus:border-[var(--color-focus)]"/>
            <Btn tone="plain" disabled={!noteDraft.trim()} onClick={addNote}>{T.elNoteAdd}</Btn>
          </div>
        </div>
      </div>
    </div>)}
  </div>);
}

function Audit({cfg,act}){
  const rows=cfg.audit||[];
  return (<div className="overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]">
    <div className="table-scroll">
    <table className="w-full text-[14px]">
      <caption className="sr-only">{T.aTitle}</caption>
      <thead><tr><Th w="w-36">{T.aTime}</Th><Th w="w-40">{T.aAction}</Th><Th>{T.aDetail}</Th></tr></thead>
      <tbody>{rows.length===0? <tr><Td cls="text-[var(--color-text-faint)]">{T.aEmpty}</Td></tr> : rows.map((a,i)=>(
        <tr key={i}><Td cls="mono text-[var(--color-text-faint)]">{fmtDate(a.t)}</Td><Td>{a.action}</Td><Td cls="mono text-[var(--color-text-muted)]">{a.detail||""}</Td></tr>))}
      </tbody>
    </table>
    </div>
  </div>);
}

/* ================= App ================= */
let accounts={}; // 轮询刷新的账号库快照（Users 表读取）
let leads=[];    // 轮询刷新的企业需求快照（EntLeads 读取）
function App(){
  const [lang,setLangState]=useState(()=>{ try{ const l=localStorage.getItem("vast-demo-lang"); return (l==="en"||l==="zh")?l:"zh"; }catch(e){ return "zh"; } });
  /* 主题与 index.html 共用 gpu-market-theme 键；初值直接读 DOM 上 head 脚本已定好的 class，避免首帧不一致 */
  const [isDark,setIsDark]=useState(()=>document.documentElement.classList.contains("dark"));
  const toggleTheme=()=>{ const nd=!isDark; document.documentElement.classList.toggle("dark",nd); setIsDark(nd);
    try{ localStorage.setItem("gpu-market-theme", nd?"dark":"light"); }catch(e){} };
  setLang(lang);
  /* 其他面板（大盘/市场/实例/资金/用户/演示数据/审计）暂屏蔽，仅保留企业需求；
     恢复：nav 数组加回对应项 + 主区渲染分支加回 + tab 初值改回 "dash" */
  const [tab,setTab]=useState("leads");
  const [store,setStore]=useState(loadStore);
  const [cfg,setCfg]=useState(()=>({...defaultCfg(),...loadAdminCfg()}));
  const [syncAt,setSyncAt]=useState(nowStr());
  const [tickN,setTickN]=useState(0); // 强制轮询重渲染
  const [mobileNav,setMobileNav]=useState(false); // P1-R1: 移动端侧栏开关
  const [notice,setNotice]=useState(null);        // P3-P3: 内联操作反馈（非模态、非全屏）
  const noticeTimer=useRef(null);
  const flash=(m)=>{ setNotice(m); if(noticeTimer.current) clearTimeout(noticeTimer.current); noticeTimer.current=setTimeout(()=>setNotice(null),2600); };
  // 轮询用户端两键（对客端 dumpState 每 1s 落盘；本端 0.5s 读取——演示"后台看得见"）
  useEffect(()=>{
    const iv=setInterval(()=>{ setStore(loadStore()); accounts=loadAccounts(); leads=listLeads(); setSyncAt(nowStr()); setTickN(n=>n+1); },500);
    const onStorage=e=>{ if(e.key===STORE_KEY||e.key===ACCOUNTS_KEY){ setStore(loadStore()); accounts=loadAccounts(); setSyncAt(nowStr()); }
      if(e.key&&e.key.startsWith(LEAD_PREFIX)){ leads=listLeads(); } };
    window.addEventListener("storage",onStorage);
    return ()=>{ clearInterval(iv); window.removeEventListener("storage",onStorage); };
  },[]);
  const d=useMemo(()=>derive(store,accounts,cfg),[store,cfg,tickN]);
  const snapInfo={has:!!cfg.backup};
  const act={
    delistOffer:(id)=>{ setCfg(c=>commitCfg({...c,delisted:[...new Set([...(c.delisted||[]),String(id)])]},T.aDelist,id)); flash(T.aDelist+" · "+id); },
    restoreOffer:(id)=>{ setCfg(c=>commitCfg({...c,delisted:(c.delisted||[]).filter(x=>x!==String(id))},T.aRestore,id)); flash(T.aRestore+" · "+id); },
    approve:(id)=>{ setCfg(c=>commitCfg({...c,approved:[...(c.approved||[]),id]},T.aApprove,id)); flash(T.aApprove+" · "+id); },
    reject:(id)=>{ setCfg(c=>commitCfg({...c,approved:(c.approved||[]).filter(x=>x!==id),delisted:[...new Set([...(c.delisted||[]),"host-"+id])]},T.aReject,id)); flash(T.aReject+" · "+id); },
    forceStop:(key)=>{ send({type:"forceStop",key}); setCfg(c=>commitCfg({...c,forceStops:[...new Set([...(c.forceStops||[]),key])]},T.aStop,key)); flash(T.aStop+" · "+key); },
    forceDestroy:(key)=>{ send({type:"forceDestroy",key}); setCfg(c=>commitCfg(c,T.aDestroy,key)); flash(T.aDestroy+" · "+key); },
    setCommission:(pct)=>{ setCfg(c=>commitCfg({...c,commission:pct/100},T.aComm,pct+"%")); flash(T.fApplied(pct)); },
    setTransFee:(on)=>{ setCfg(c=>commitCfg({...c,transitionStorageFee:on},T.aTransFee,on?"on":"off")); flash(T.fTransFeeApplied(on)); },
    payoutOk:(q)=>{ setCfg(c=>{ const po=c.payouts||{approved:[],rejected:[]};
      if(po.approved.some(x=>x.id===q.id)) return c; // 幂等：重复点击不重复入账本
      return commitCfg({...c,payouts:{approved:[...po.approved,{id:q.id,email:q.email,channel:q.channel,amt:q.amt,t:q.t,at:Date.now()}],rejected:po.rejected}},T.aPayoutOk,q.email+" · $"+q.amt); });
      flash(T.aPayoutOk+" · "+q.email+" $"+q.amt); },
    payoutNo:(q)=>{ setCfg(c=>{ const po=c.payouts||{approved:[],rejected:[]};
      if(po.rejected.some(x=>x.id===q.id)) return c;
      return commitCfg({...c,payouts:{approved:po.approved,rejected:[...po.rejected,{id:q.id,email:q.email,amt:q.amt,t:q.t,at:Date.now()}]}},T.aPayoutNo,q.email+" · $"+q.amt); });
      flash(T.aPayoutNo+" · "+q.email); },
    ban:(e)=>{ setCfg(c=>commitCfg({...c,banned:[...new Set([...(c.banned||[]),e])]},T.aBan,e)); flash(T.uBanTip(e)); },
    unban:(e)=>{ setCfg(c=>commitCfg({...c,banned:(c.banned||[]).filter(x=>x!==e)},T.aUnban,e)); flash(T.uUnbanTip(e)); },
    // 企业需求：先重读该键最新值再改（防覆盖 0.5s 轮询窗口内的并发写入）；won 终态拒绝迁移；每次迁移强制写 timeline
    leadStatus:(l,to,reason)=>{ const fresh=loadLead(l.ref); if(!fresh||fresh.status==="won"||fresh.status===to) return;
      saveLead({...fresh, status:to, timeline:[{t:Date.now(),type:"status",from:fresh.status,to,...(reason?{reason}:{})},...(fresh.timeline||[])]});
      leads=listLeads();
      setCfg(c=>commitCfg(c,T.aLeadStatus,l.ref+" · "+fresh.status+"→"+to+(reason?" · "+reason:"")));
      flash(T.aLeadStatus+" · "+l.ref+" → "+to); },
    leadNote:(l,tx)=>{ const fresh=loadLead(l.ref); if(!fresh) return;
      saveLead({...fresh, timeline:[{t:Date.now(),type:"note",text:tx},...(fresh.timeline||[])]});
      leads=listLeads();
      setCfg(c=>commitCfg(c,T.aLeadNote,l.ref+" · "+tx.slice(0,40)));
      flash(T.aLeadNote+" · "+l.ref); },
    inject:()=>{
      const snap={store:loadStore(), accounts:loadAccounts(), leads:listLeads(), at:Date.now()};
      // 在线探测：150ms 内收到用户端 pong → 其自行注入（写权分离）；离线 → 本端读-改-写合并直写（单开 Admin 也能演示）
      const pid="p"+Date.now(); let online=false;
      const onPong=(ev)=>{ if(ev.data&&ev.data.type==="pong"&&ev.data.id===pid) online=true; };
      try{ _BC.addEventListener("message",onPong); }catch(e){}
      send({type:"ping",id:pid});
      setTimeout(()=>{
        try{ _BC.removeEventListener("message",onPong); }catch(e){}
        if(!online){ // 离线直写：与用户端 inject 处理器同一合并口径
          const s=loadStore()||{};
          const merged={...s,
            balance:+(((s.balance)||0)+GEN_PAYLOAD.balance).toFixed(2),
            hostMachines:[...GEN_PAYLOAD.hostMachines,...(Array.isArray(s.hostMachines)?s.hostMachines:[])],
            ledger:trimLedger([...GEN_PAYLOAD.ledger,...(Array.isArray(s.ledger)?s.ledger:[])])};
          try{ localStorage.setItem(STORE_KEY,JSON.stringify(merged)); }catch(e){}
          const a=loadAccounts(); GEN_PAYLOAD.accounts.forEach(x=>{ if(!a[x.email]) a[x.email]={provider:"email",createdAt:Date.now()}; });
          try{ localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(a)); }catch(e){}
          setStore(loadStore()); accounts=loadAccounts();
        }else{ send({type:"inject",payload:GEN_PAYLOAD}); }
        // 企业需求种子不走用户端（leads 键写权在本端），在线/离线统一本端落盘；幂等：已有同 ref 键跳过
        GEN_LEADS().forEach(r=>{ if(!loadLead(r.ref)) saveLead(r); });
        leads=listLeads();
        flash(T.genDone);
        setCfg(c=>commitCfg({...c,backup:snap},T.aGen,(online?"client":"offline-direct")+" · "+GEN_PAYLOAD.hostMachines[0].id));
      },150);
    },
    restore:()=>{ const b=cfg.backup; if(!b) return;
      // P3-P3: 返回值/写盘结果检查——失败不入"成功"口径
      let ok=true;
      try{ if(b.store){ localStorage.setItem(STORE_KEY,JSON.stringify(b.store)); } }catch(e){ ok=false; }
      try{ if(b.accounts){ localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(b.accounts)); } }catch(e){ ok=false; }
      // 企业需求仅新快照接管（旧快照无该字段，不清不写防误删真实线索）；清残留按键名前缀枚举——
      // 不能走 listLeads()（JSON 解析失败的幽灵键会被过滤掉而漏清，实测 GHOST 键残留）
      try{ if(Array.isArray(b.leads)){
        const kill=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(LEAD_PREFIX)) kill.push(k); }
        kill.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
        b.leads.forEach(r=>saveLead(r));
      } }catch(e){ ok=false; }
      send({type:"cfg"}); send({type:"reload"});
      setStore(loadStore()); accounts=loadAccounts(); leads=listLeads();
      setCfg(c=>commitCfg(c,T.aSnapRestore,(ok?"ok":"write-failed")+" · "+(b.store?"store":"")+(b.accounts?" accounts":"")));
      flash(ok? T.genRestored : (_LANG==="zh"?"快照还原写入失败":"snapshot restore write failed"));
    },
    resetCfg:()=>{ const fresh=defaultCfg(); saveAdminCfg(fresh); send({type:"cfg"}); setCfg(fresh); flash(T.resetDone); },
  };
  const nav=[["leads",T.navEnt]];
  const toggleLang=()=>{ const nl=lang==="zh"?"en":"zh"; try{localStorage.setItem("vast-demo-lang",nl)}catch(e){}; setLangState(nl); };
  return (<div className="flex min-h-screen">
    <a className="skip-link" href="#admin-main">{lang==="zh"?"跳到主要内容":"Skip to main content"}</a>
    {/* P1-R1: 移动端 backdrop */}
    {mobileNav && <div className="sidebar-backdrop fixed inset-0 z-30 hidden bg-black/40 max-md:block" onClick={()=>setMobileNav(false)} aria-hidden="true"/>}
    {/* 侧栏 */}
    <aside id="admin-sidebar" data-open={mobileNav} className={`sidebar-responsive flex w-64 shrink-0 flex-col border-r border-[var(--color-border)] bg-[var(--color-surface)] max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40 max-md:-translate-x-full md:static`}>
      <div className="border-b border-[var(--color-border)] px-5 py-4">
        <div className="text-[16px] font-bold tracking-tight">Mekong<span className="text-[var(--color-accent-on-tint)]">·</span>Admin</div>
        <span className="mt-1 inline-block rounded border border-[var(--color-border)] px-1 py-px text-[12px] uppercase tracking-wider text-[var(--color-text-muted)]">{T.appDemo}</span>
      </div>
      <nav className="flex-1 space-y-1 p-3">
        {nav.map(([k,l])=>(
          <button key={k} onClick={()=>{setTab(k); setMobileNav(false);}}
            className={`btn-touch w-full rounded-lg px-3 py-2 text-left text-[14px] ${tab===k?"bg-[var(--color-accent)]/10 font-semibold text-[var(--color-accent-on-tint)]":"text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]"}`}
            aria-current={tab===k?"page":undefined}>{l}</button>))}
      </nav>
      <div className="space-y-2 border-t border-[var(--color-border)] p-4">
        <a href="./index.html" className="btn-touch block rounded-lg border border-[var(--color-border)] px-3 py-2 text-center text-[13px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)]">{T.openClient}</a>
        <button onClick={toggleTheme} aria-pressed={isDark} aria-label={lang==="zh"?(isDark?"切换到浅色模式":"切换到深色模式"):(isDark?"Switch to light mode":"Switch to dark mode")}
          className="btn-touch w-full rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[13px] text-[var(--color-text-muted)] hover:border-[var(--color-border-strong)]">{isDark?"☀":"🌙"}</button>
        <button onClick={toggleLang} aria-label={lang==="zh"?"Switch to English":"切换到中文"} className="btn-touch w-full rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[13px] text-[var(--color-text-muted)] hover:border-[var(--color-border-strong)]">{lang==="zh"?"EN":"中文"}</button>
        <p className="text-[13px] leading-snug text-[var(--color-text-faint)]">{T.sidenavHint}</p>
      </div>
    </aside>
    {/* 主区 */}
    <main id="admin-main" tabIndex={-1} className="min-w-0 flex-1 p-5 md:p-8">
      <header className="mb-6 flex flex-wrap items-center justify-between gap-y-2">
        <div className="flex items-center gap-2">
          <button onClick={()=>setMobileNav(v=>!v)} className="hidden max-md:flex rounded-lg border border-[var(--color-border)] p-2 text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]" aria-label="Toggle navigation" aria-expanded={mobileNav} aria-controls="admin-sidebar">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <h1 className="text-[20px] font-bold tracking-tight">{nav.find(n=>n[0]===tab)?.[1]}</h1>
        </div>
        <span className="flex items-center gap-1.5 text-[13px] text-[var(--color-text-faint)]" title={T.syncHint}>
          <span className="dot-pulse inline-block h-1.5 w-1.5 rounded-full bg-[var(--color-success)] motion-reduce:animate-none"></span>{T.dLive} · {syncAt}
        </span>
        {/* 播报区必须常驻：条件渲染的 aria-live 容器在内容出现前不在无障碍树里，读屏不会播报。
            空时用 sr-only 保留节点、去掉视觉占位；内容从空变为有值才是可靠的播报时机。 */}
        <span role="status" aria-live="polite" aria-atomic="true"
          className={notice?"rounded border border-[var(--color-success)]/40 bg-[var(--color-success)]/5 px-2.5 py-1 text-[13px] text-[var(--color-success-on-tint)]":"sr-only"}>{notice||""}</span>
      </header>
      {tab==="leads" && <EntLeads act={act} leads={leads}/>}
    </main>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
