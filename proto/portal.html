<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('boot-error');
  if(d){ d.style.display='block'; d.textContent+=' | '+(e.message||e.type); }
});
/* 主题与 index.html 同键同默认值（未设置=暗色）；head 内同步执行，避免首帧闪烁。 */
(function(){
  try{ var t=localStorage.getItem("gpu-market-theme");
       document.documentElement.classList.toggle("dark", t!=="light"); }catch(e){}
})();

<style>
  @custom-variant dark (&:where(.dark, .dark *));
  /* tokens:begin —— 以下整块由 tools/sync-tokens.mjs 生成，勿手改 */
  :root {
  /* 令牌由 tools/sync-tokens.mjs 生成 —— 不要手改本块；改脚本后重跑。四页共用同一份取值。 */
    --color-bg: #f8fafc; --color-surface: #ffffff; --color-surface-alt: #f1f5f9;
    --color-text: #0f172a; --color-text-secondary: #334155; --color-text-muted: #475569; --color-text-faint: #5b6673;

  .dark {
  /* 同浅色档的同一套取值；深色下语义色底是亮色，字色改用 --color-on-solid / --color-*-on-tint。 */
    --color-bg: #0f172a; --color-surface: #1e293b; --color-surface-alt: #1e293b;

    --color-accent-on-tint: #60a5fa;

  /* tokens:end */
  html,body{background:var(--color-bg);color:var(--color-text);}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--color-scrollbar,#334155);border-radius:4px;}
  /* Tour 高亮：仅 outline，不注入 DOM、不碰布局链 */
  .tour-active{outline:2px solid var(--color-accent-hover);outline-offset:3px;border-radius:8px;animation:tourPulse 1.6s ease-in-out infinite;}
  @keyframes tourPulse{0%,100%{outline-color:var(--color-accent-hover);}50%{outline-color:var(--color-info);}}
  .fade-in{animation:fadeIn .5s ease both;} @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .node-lit rect{stroke:var(--color-accent-hover);fill:var(--color-accent-hover);fill-opacity:.12;}
  /* 键盘可见焦点：此前本页 :focus-visible 规则数为 0，键盘用户无法判断焦点位置（WCAG 2.4.7 AA）。 */

     @layer utilities，未分层样式永远压过已分层样式，会把显式更大的 min-h-[44px] 一起压掉。 */
  @layer base {

  @media (prefers-reduced-motion: reduce) {

  }

<script type="text/babel" data-presets="react">
/* =============================================================
   Instance Portal 演示页（模拟第三方工作区网关落地）
   原则：
   - 本页仅演示跳转流程与信息架构，非最终 UI 设计
   - 零 localStorage 读写（避免多 tab 竞态）；实例信息全部来自 URL 参数快照
   - 真实产品中实例状态权威源在平台 API，URL 参数不可作为状态依据
   结构：无参直达＝场景选择页（Hub）；选场景 → Tour 自动播放（步骤高亮）
   ============================================================= */
const {useState,useEffect,useRef} = React;

/* ---- URL 参数解析（一次性入口快照；演示便利的 state/story 参数在真实产品中不存在） ---- */
const QS = new URLSearchParams(location.search);
const P = {
 sid:   QS.get("sid")||"",
 gpu:   QS.get("gpu")||"",
 tpl:   QS.get("tpl")||"",
 lm:    QS.get("lm")||"ssh",
 ip:    QS.get("ip")||"",
 port:  QS.get("port")||"",
 remain:Math.max(0, parseInt(QS.get("remain")||"0",10)||0),
 lang:  QS.get("lang")==="en"?"en":"zh",
 state: QS.get("state")||"",   // 仅演示：expired / disconnected（无 story 直开仍支持）
 story: Math.max(-1, parseInt(QS.get("story")||"-1",10)), // 场景编号（-1=无）
 hub:   QS.get("hub")==="1",   // 场景选择页开关：实例工作区顶栏「场景演示」可达（演示动线产品内闭环）
};
const ACTION_EV = "portal:action"; // App 播放器 → skin 组件的动作通道（CustomEvent，免 prop drilling）

/* ---- i18n 双包（跟随入口 locale 参数） ---- */
const I18N = {
 zh:{

  remainLbl:"剩余租期",addr:"地址",tplLbl:"模板",

  discTitle:"宿主连接中断",discLead:"宿主机器连接异常，工作区已断开。平台正在按协议处理，请稍后在 Mekong 控制台查看实例状态。",
  backBtn:"前往 Mekong 控制台",

  vlResp:"响应",

  jyRun:"Run",jyRunning:"Running…",jyReset:"Reset",
  cvTitle:"ComfyUI",cvHint:"Node canvas (demo: drag disabled)",
  cvQueue:"Queue Prompt",cvQueuing:"Queuing…",cvOut:"Sample · 1024×1024",
  vlTitle:"vLLM Endpoint",vlHint:"OpenAI-compatible inference endpoint",vlBase:"Base URL",vlCurl:"Quick check",vlModels:"Loaded models",vlCopy:"Copy",vlCopied:"Copied",
  vlResp:"Response",
  hubTitle:"Instance Portal · Scenario demos",hubSub:"Five most-frequent tenant scenarios, auto-played.",
  hubDenied:"In production, workspace URLs without valid credentials are rejected (one-time credential + non-bookmarkable).",
  scTrain:"Daily training",scTrainD:"First cell in JupyterLab — 80% of a tenant's time",
  scInfer:"Inference call",scInferD:"OpenAI-compatible endpoint, ready to use",
  scImg:"Image generation",scImgD:"One-click ComfyUI workflow",
  scExpire:"Lease expiry",scExpireD:"Disconnect & guidance at expiry",
  scDrop:"Host drop",scDropD:"Handling P2P host failures",
  steps:"steps",tbPrev:"Prev",tbNext:"Next",tbExit:"Exit tour",tbReplay:"Replay",tbHub:"Scenarios",tbDone:"Tour finished",
  hubBtn:"Scenario demos",hubResume:"Enter workspace directly (skip tour)",
  banner:"Host connection unstable — trying to recover…",
 },
};
const T = I18N[P.lang];
const fmtDur=(s)=>{ const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
 const pad=n=>String(n).padStart(2,"0"); return h>0? `${h}h ${pad(m)}m` : (m>0? `${m}m ${pad(sec)}s` : `${sec}s`); };

/* ---- 五个场景脚本：act 语义见 dispatchStep；步骤文案双语 ---- */
const STORIES=[
 {id:"train",icon:"▸",view:"jupyter",tpl:"PyTorch 2.5.1",remain:82800,
  card:{title:"scTrain",desc:"scTrainD"},
  steps:[
   {act:"hl:top",
    zh:"租户在实例卡点 Open——新标签页直达工作区。顶栏展示实例身份快照与剩余租期；第三方须接收入口参数并展示（参数仅展示，鉴权以凭证为准）。",
    en:"Tenant clicks Open on the instance card — workspace opens in a new tab. Header shows the instance snapshot and time left; the vendor must parse and display entry params (display-only; auth relies on the credential)."},
   {act:"hl:filetree",
    zh:"训练模板直达 JupyterLab：第三方按模板路由工作区形态；反向代理必须支持 WebSocket（JupyterLab 硬依赖）与 per-instance 转发规则。",
    en:"Training template lands in JupyterLab: the vendor routes workspace shape by template; the reverse proxy must support WebSocket (hard dependency) and per-instance routing rules."},

    en:"A cell runs automatically — this is a tenant's daily routine once the GPU is theirs."},

    zh:"torch 就绪、GPU 识别成功。租户的核心诉求＝在浏览器里直接开干，无需本地环境。",
    en:"torch ready, GPU recognized. The tenant's core need: start working right in the browser, no local setup."},
  ]},
 {id:"infer",icon:"◈",view:"vllm",tpl:"vLLM · OpenAI 兼容",remain:82800,
  card:{title:"scInfer",desc:"scInferD"},

    zh:"推理模板同样从 Open 进入，顶栏身份信息一致。",

    zh:"推理模板的出口＝OpenAI 兼容端点文档页。统一 8080 代理口，容器内部端口映射由平台负责。",

    en:"Copy the curl and call it — OpenAI SDK compatible, zero migration cost for tenants."},
   {act:"hl:vllm-resp",
    zh:"秒级返回。第三方网关须承载此类 API 流量的低延迟反向代理。",

  ]},
 {id:"img",icon:"▦",view:"comfy",tpl:"ComfyUI",remain:82800,

  steps:[
   {act:"hl:top",

/* ---- 顶栏：实例身份快照 + 剩余租期倒计时（纯前端递减，不落任何存储；speed 供到期场景快进）
      参数走 props（P 为加载时快照，Hub 选卡经 replaceState 不重载） ---- */
function TopBar({remain,speed,sid,gpu,ip,port,tpl,onOpenHub}){
 const [t,setT]=useState(remain);
 /* 主题与 index.html 共用 gpu-market-theme；初值读 head 脚本已定好的 class，避免首帧不一致 */
 const [isDark,setIsDark]=useState(()=>document.documentElement.classList.contains("dark"));
 const onToggleTheme=()=>{ const nd=!isDark; document.documentElement.classList.toggle("dark",nd); setIsDark(nd);
   try{ localStorage.setItem("gpu-market-theme", nd?"dark":"light"); }catch(e){} };
 useEffect(()=>{ setT(remain); },[remain]);
 useEffect(()=>{ if(remain<=0) return; const iv=setInterval(()=>setT(x=>Math.max(0,x-speed)),1000); return ()=>clearInterval(iv); },[remain,speed]);
 return (
  <header className="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-[var(--color-border)] bg-[var(--color-surface)] px-5 py-3">
    <div className="flex items-center gap-2" data-tour="top">
    <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-[var(--color-success)] text-[13px] font-bold text-[var(--color-on-solid)]">W</span>
    <div className="leading-tight">
     <div className="text-[14px] font-semibold">Instance Portal <span className="mono ml-1 text-[12px] font-normal text-[var(--color-text-secondary)]">{sid}</span></div>
     <div className="text-[11px] text-[var(--color-text-faint)]">{T.brandTip}</div>
    </div>
   </div>
   <div className="ml-auto flex flex-wrap items-center gap-x-5 gap-y-1 text-[12px] text-[var(--color-text-secondary)]">
    {gpu && <span><span className="text-[var(--color-text-faint)]">GPU </span><span className="mono">{gpu}</span></span>}
    {(ip&&port) && <span className="mono" title={T.addr}>{ip}:{port}</span>}
    {tpl && <span className="max-w-[220px] truncate" title={`${T.tplLbl}: ${tpl}`}>{tpl}</span>}
    {t>0 && <span className={`mono rounded-md border px-2 py-0.5 ${speed>1?"border-[var(--color-warning)] text-[var(--color-warning-on-tint)]":"border-[var(--color-border)]"}`}><span className="text-[var(--color-text-faint)]">{T.remainLbl} </span>{fmtDur(t)}</span>}
    <button onClick={onOpenHub}
     className="rounded-lg border border-[var(--color-info)]/50 px-3 py-1 text-[12px] text-[var(--color-info-on-tint)] hover:bg-[var(--color-info)]/10">{T.hubBtn}</button>
    <button onClick={()=>{ try{window.close();}catch(e){} try{location.href="/proto/index.html";}catch(e){} }}
     className="rounded-lg border border-[var(--color-border-strong)] px-3 py-1 text-[12px] hover:text-[var(--color-text)]">{T.back}</button>
    <button onClick={onToggleTheme} aria-pressed={isDark}
     aria-label={isDark?"Switch to light mode":"Switch to dark mode"}
     className="rounded-lg border border-[var(--color-border-strong)] px-2 py-1 text-[13px] hover:bg-[var(--color-surface-alt)]">{isDark?"☀":"🌙"}</button>
   </div>
  </header>);
}

/* ---- 皮 1：JupyterLab（文件树 + 可运行 cell；监听 tour 动作 runCell） ---- */
function JupyterSkin({gpu}){
 const [phase,setPhase]=useState("idle"); // idle | running | done
 const timer=useRef(null);
 const code=`import torch\nprint(torch.__version__, torch.cuda.is_available())\nprint(torch.cuda.get_device_name(0))`;
 const run=()=>{ setPhase("running"); timer.current=setTimeout(()=>setPhase("done"),700); };
 useEffect(()=>()=>clearTimeout(timer.current),[]);
 useEffect(()=>{ // Tour 动作通道：runCell → 复用本地 run（幂等）
  const h=(e)=>{ if(e.detail==="runCell"&&phase!=="running") run(); };
  window.addEventListener(ACTION_EV,h); return ()=>window.removeEventListener(ACTION_EV,h);
 },[phase]);
 const reset=()=>setPhase("idle");
 const files=[["notebooks","d",1],["data","d",1],["train.py","f",0],["requirements.txt","f",0],["README.md","f",0]];
 return (
  <div className="flex min-h-[calc(100vh-57px)] min-w-0">
   <aside data-tour="filetree" className="hidden w-52 shrink-0 border-r border-[var(--color-border)] bg-[var(--color-surface)] p-3 md:block">
    <div className="mb-2 text-[11px] font-semibold uppercase tracking-widest text-[var(--color-text-faint)]">{T.jyTitle}</div>
    <ul className="space-y-1 text-[13px] text-[var(--color-text-secondary)]">
     {files.map(([n,k])=>(
      <li key={n} className="mono flex items-center gap-1.5 rounded px-2 py-1 hover:bg-[var(--color-surface-alt)]">
       <span className="text-[var(--color-text-faint)]">{k==="d"?"▸":"·"}</span>{n}</li>))}
    </ul>
   </aside>
   <div className="min-w-0 flex-1 p-5">
    <p className="mb-3 text-[12px] text-[var(--color-text-faint)]">{T.jyHint}</p>
    <div data-tour="cell" className="overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]">
     <div className="flex items-center justify-between border-b border-[var(--color-border)] px-3 py-2">
      <span className="mono text-[12px] text-[var(--color-text-muted)]">In [1]</span>
      <div className="flex gap-2">
       <button onClick={run} disabled={phase==="running"}
        className="rounded-md bg-[var(--color-success)]/90 px-3 py-1 text-[12px] font-semibold text-[var(--color-on-solid)] hover:bg-[var(--color-success)] disabled:opacity-50">
        {phase==="running"?T.jyRunning:T.jyRun}</button>
       <button onClick={reset} className="rounded-md border border-[var(--color-border-strong)] px-3 py-1 text-[12px] text-[var(--color-text-secondary)] hover:text-[var(--color-text)]">{T.jyReset}</button>
      </div>
     </div>
     <pre className="mono overflow-x-auto p-4 text-[13px] leading-6 text-[var(--color-text)]">{code}</pre>
     {phase==="done" && (
      <div data-tour="cellout" className="mono fade-in border-t border-[var(--color-border)] bg-[var(--color-bg)] p-4 text-[13px] leading-6 text-[var(--color-success)]">
       <div>2.5.1+cu124 True</div>
       <div>{gpu||"NVIDIA GPU"}</div>
       <div className="mt-2 text-[var(--color-text-secondary)]">
        +-----------------------------------------------------------------------------+<br/>
        | NVIDIA-SMI 570.xx&nbsp;&nbsp;Driver: 570.xx&nbsp;&nbsp;CUDA: 12.4&nbsp;&nbsp;Persistence-M: On |<br/>
        | GPU&nbsp;&nbsp;Name&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;P-State&nbsp;&nbsp;Bus-Id&nbsp;&nbsp;Util&nbsp;&nbsp;Memory-Usage&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|<br/>
        |&nbsp;&nbsp;0&nbsp;&nbsp;{(gpu||"GPU").slice(0,18).padEnd(18)}&nbsp;&nbsp;N/A&nbsp;&nbsp;&nbsp;&nbsp;N/A&nbsp;&nbsp;&nbsp;&nbsp;42%&nbsp;&nbsp;&nbsp;&nbsp;1.2GiB / 32GiB&nbsp;&nbsp;&nbsp;|<br/>
        +-----------------------------------------------------------------------------+
       </div>
      </div>)}
    </div>
   </div>
  </div>);
}

/* ---- 皮 2：ComfyUI（节点画布 + Queue 假出图；监听 tour 动作 comfyQueue） ---- */
function ComfySkin(){
 const [q,setQ]=useState("idle"); // idle | queuing | done
 const timers=useRef([]);
 useEffect(()=>()=>{ timers.current.forEach(clearTimeout); },[]);
 useEffect(()=>{ // Tour 动作通道：comfyQueue
  const h=(e)=>{ if(e.detail==="comfyQueue"&&q==="idle"){
    setQ("queuing");
    timers.current.push(setTimeout(()=>setQ("done"),2600));
  } };
  window.addEventListener(ACTION_EV,h); return ()=>window.removeEventListener(ACTION_EV,h);
 },[q]);
 const node=(x,y,w,title,lines,i)=>(
  <g key={title} className={q!=="idle"?`node-lit ${i<=3?"":""}`:""} style={q==="queuing"?{transition:"stroke .4s, fill .4s",transitionDelay:`${i*0.5}s`}:null}>
   <rect x={x} y={y} width={w} height={26+lines.length*16} rx="8" fill="var(--color-surface)" stroke="var(--color-border-strong)" strokeWidth="1.2"/>
   <text x={x+10} y={y+17} fontSize="11" fontWeight="600" fill="var(--color-text)">{title}</text>
   {lines.map((l,j)=>(<text key={j} x={x+10} y={y+33+j*16} fontSize="10" fill="var(--color-text-muted)">{l}</text>))}
  </g>);
 const wire=(x1,y1,x2,y2)=>(<path key={`${x1}-${y1}`} d={`M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}`} stroke="var(--color-accent-hover)" strokeWidth="1.5" fill="none"/>);
 return (
  <div className="min-w-0 p-5">
   <p className="mb-3 text-[12px] text-[var(--color-text-faint)]">{T.cvHint}</p>
   <div className="flex flex-wrap items-start gap-4">
    <div data-tour="comfy-canvas" className="min-w-0 flex-1 overflow-x-auto rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4"
     style={{backgroundImage:"radial-gradient(var(--color-border) 1px, transparent 1px)",backgroundSize:"22px 22px"}}>
     <svg viewBox="0 0 860 300" className="min-w-[560px]" role="img" aria-label={T.cvTitle}>
      {wire(190,120,260,120)}{wire(450,120,520,120)}{wire(700,120,750,120)}
      {node(20,90,170,"Load Checkpoint",["sd3.5_large.safetensors","· 32GB VRAM"],0)}
      {node(260,70,190,"CLIP Text Encode",["prompt: cyberpunk city","negative: blurry"],1)}
      {node(520,90,180,"KSampler",["steps: 28 · cfg: 4.5","1024×1024 · seed: 42"],2)}
      {node(750,95,90,"Save",["PNG"],3)}
     </svg>
     <div className="mt-3 flex justify-end">
      <button disabled={q!=="idle"}
       onClick={()=>{ setQ("queuing"); timers.current.push(setTimeout(()=>setQ("done"),2600)); }}
       className="rounded-md bg-[var(--color-accent)] px-3 py-1 text-[12px] font-semibold text-white hover:bg-[var(--color-accent-strong)] disabled:opacity-50">
       {q==="queuing"?T.cvQueuing:T.cvQueue}</button>
     </div>
    </div>
    {q==="done" && (
     <div data-tour="comfy-out" className="fade-in w-56 shrink-0 overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]">
      {/* 占位图：代表「第三方产出的图像内容」，不是本产品的 UI 表面。
          此前用 4 段硬编码渐变（#312e81/#7c3aed/#db2777/#f59e0b），越出调色板。改为令牌底 + 虚线边 —— 虚线是「此处应有图而没有」的通用占位信号，
          不引入新色值，也不假装有内容。 */}
      <div className="flex h-40 items-center justify-center border-b border-dashed border-[var(--color-border-strong)] bg-[var(--color-surface-alt)]">
       <span className="rounded-md border border-[var(--color-border-strong)] px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">SAMPLE</span>
      </div>
      <div className="mono px-3 py-2 text-[12px] text-[var(--color-text-secondary)]">{T.cvOut}</div>
     </div>)}
   </div>
  </div>);
}

/* ---- 皮 3：vLLM Endpoint 文档页（base URL + curl + 假响应；监听 tour 动作 vllmRespond） ---- */
function VllmSkin({ip,port}){
 const base=`http://${ip||"<host>"}:${port||"8080"}/v1`;
 const curl=`curl ${base}/chat/completions \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"meta-llama/Llama-3.1-8B-Instruct","messages":[{"role":"user","content":"hello"}]}'`;
 const [copied,setCopied]=useState(false);
 const [resp,setResp]=useState(false);
 const tRef=useRef(null);
 useEffect(()=>()=>clearTimeout(tRef.current),[]);
 useEffect(()=>{ // Tour 动作通道：vllmRespond
  const h=(e)=>{ if(e.detail==="vllmRespond") setResp(true); };
  window.addEventListener(ACTION_EV,h); return ()=>window.removeEventListener(ACTION_EV,h);
 },[]);
 const copy=()=>{ if(navigator.clipboard?.writeText) navigator.clipboard.writeText(curl).then(()=>{setCopied(true);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setCopied(false),1500);}).catch(()=>{}); };
 return (
  <div className="min-w-0 max-w-3xl p-5">
   <p className="mb-3 text-[12px] text-[var(--color-text-faint)]">{T.vlHint}</p>
   <section data-tour="vlbase" className="mb-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
    <div className="mb-2 text-[11px] font-semibold uppercase tracking-widest text-[var(--color-text-faint)]">{T.vlBase}</div>
    <code className="mono block truncate rounded-lg bg-[var(--color-bg)] p-3 text-[13px] text-[var(--color-success)]">{base}</code>
   </section>
   <section data-tour="vlcurl" className="mb-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
    <div className="mb-2 flex items-center justify-between">
     <div className="text-[11px] font-semibold uppercase tracking-widest text-[var(--color-text-faint)]">{T.vlCurl}</div>
     <button onClick={copy} className="rounded-md border border-[var(--color-border-strong)] px-2.5 py-1 text-[12px] text-[var(--color-text-secondary)] hover:text-[var(--color-text)]">{copied?T.vlCopied:T.vlCopy}</button>
    </div>
    <pre className="mono overflow-x-auto rounded-lg bg-[var(--color-bg)] p-3 text-[13px] leading-6 text-[var(--color-text)]">{curl}</pre>
   </section>
   {resp && (
    <section data-tour="vllm-resp" className="fade-in mb-4 rounded-xl border border-[var(--color-success)]/40 bg-[var(--color-surface)] p-4">
     <div className="mb-2 text-[11px] font-semibold uppercase tracking-widest text-[var(--color-success)]">{T.vlResp} · 200 OK · 0.4s</div>
     <pre className="mono overflow-x-auto rounded-lg bg-[var(--color-bg)] p-3 text-[13px] leading-6 text-[var(--color-success)]">{`{
  "id": "cmpl-8f4a2",
  "choices": [{
    "message": {"role": "assistant", "content": "Hello! How can I help you today?"}
  }],
  "usage": {"prompt_tokens": 12, "completion_tokens": 9, "total_tokens": 21}
}`}</pre>
    </section>)}
   <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
    <div className="mb-2 text-[11px] font-semibold uppercase tracking-widest text-[var(--color-text-faint)]">{T.vlModels}</div>
    <ul className="mono space-y-1.5 text-[13px] text-[var(--color-text-secondary)]">
     <li>meta-llama/Llama-3.1-8B-Instruct <span className="text-[var(--color-success)]">· ready</span></li>
     <li>Qwen/Qwen2.5-7B-Instruct <span className="text-[var(--color-text-faint)]">· idle</span></li>
    </ul>
   </section>
  </div>);
}

/* ---- Tour 播放器气泡（底部居中；步进控制） ---- */
function TourBar({story,step,done,onPrev,onNext,onExit,onReplay}){
 const st=STORIES[story], sp=st.steps[step];
 const text = P.lang==="en"? sp.en : sp.zh;
 const last = step>=st.steps.length-1;
 return (
  <div className="fade-in fixed bottom-4 left-1/2 z-50 w-[min(92vw,680px)] -translate-x-1/2 rounded-2xl border border-[var(--color-border-strong)] bg-[var(--color-surface)] p-3.5 shadow-2xl">
   <div className="flex items-start gap-3">
    <p className="min-w-0 flex-1 text-[13px] leading-[18px] text-[var(--color-text)]">{done? `${T.tbDone} · ${T[st.card.title]}` : text}</p>
   </div>
   <div className="mt-2.5 flex items-center gap-2">
    <span className="mono text-[11px] text-[var(--color-text-faint)]">{done? `${st.steps.length}/${st.steps.length}` : `${step+1}/${st.steps.length}`}</span>
    <div className="ml-auto flex gap-2">
     {done? (<>
       <button onClick={onReplay} className="rounded-md border border-[var(--color-border-strong)] px-2.5 py-1 text-[12px] text-[var(--color-text-secondary)] hover:text-[var(--color-text)]">{T.tbReplay}</button>
       <button onClick={onExit} className="rounded-md bg-[var(--color-accent)] px-2.5 py-1 text-[12px] font-semibold text-white hover:bg-[var(--color-accent-strong)]">{T.tbHub}</button>
      </>):(<>
       {step>0 && <button onClick={onPrev} className="rounded-md border border-[var(--color-border-strong)] px-2.5 py-1 text-[12px] text-[var(--color-text-secondary)] hover:text-[var(--color-text)]">{T.tbPrev}</button>}
       <button onClick={onNext} className="rounded-md bg-[var(--color-success)]/90 px-3 py-1 text-[12px] font-semibold text-[var(--color-on-solid)] hover:bg-[var(--color-success)]">{T.tbNext}</button>
       <button onClick={onExit} className="rounded-md px-2 py-1 text-[12px] text-[var(--color-text-faint)] hover:text-[var(--color-text-secondary)]">{T.tbExit}</button>
      </>)}
    </div>
   </div>
  </div>);
}

/* ---- URL 同步：story 进/出（replaceState，刷新可回放同场景）；从 Hub 进入时补演示默认实例参数 ---- */
function syncStoryUrl(i){
 const q=new URLSearchParams(location.search);
 if(i>=0){
  q.set("story",String(i)); q.set("tpl",STORIES[i].tpl); q.set("remain",String(STORIES[i].remain)); q.delete("state"); q.delete("hub");
  if(!q.get("sid")){ q.set("sid","i-480221"); q.set("gpu","RTX 5080"); q.set("ip","65.150.23.88"); q.set("port","45678"); }
 }
 else q.delete("story");
 try{ history.replaceState(null,"",`${location.pathname}?${q.toString()}`); }catch(e){}
}
function syncHubUrl(on){
 const q=new URLSearchParams(location.search);
 if(on) q.set("hub","1"); else q.delete("hub");
 try{ history.replaceState(null,"",`${location.pathname}?${q.toString()}`); }catch(e){}
}

function App(){
 const initStory = (P.story>=0 && P.story<STORIES.length)? P.story : null;
 const [story,setStory]=useState(initStory);
 const [step,setStep]=useState(0);
 const [done,setDone]=useState(false);
 const [viewOverride,setViewOverride]=useState(null); // goto:* 切皮（S4/S5）
 const [speed,setSpeed]=useState(1);                  // fastForward 快进倒计时
 const [banner,setBanner]=useState(false);            // S5 警示横幅
 const [hub,setHub]=useState(P.hub);                  // 场景选择页（工作区内可达）
 const timers=useRef([]);

 const clearTimers=()=>{ timers.current.forEach(clearTimeout); timers.current=[]; };
 useEffect(()=>()=>clearTimers(),[]);

 const pick=(i)=>{ clearTimers(); setHub(false); syncHubUrl(false); setStory(i); setStep(0); setDone(false); setViewOverride(null); setSpeed(1); setBanner(false); syncStoryUrl(i); };
 const exit=()=>{ clearTimers(); setStory(null); setStep(0); setDone(false); setViewOverride(null); setSpeed(1); setBanner(false); syncStoryUrl(-1); setHub(true); syncHubUrl(true); };
 const replay=()=>{ clearTimers(); setStep(0); setDone(false); setViewOverride(null); setSpeed(1); setBanner(false); };
 const next=()=>{ const st=STORIES[story]; if(step<st.steps.length-1){ setStep(step+1); } else setDone(true); };
 const prev=()=>{ if(done){ setDone(false); return; } if(step>0) setStep(step-1); };
 const openHub=()=>{ clearTimers(); setStory(null); setDone(false); setViewOverride(null); setSpeed(1); setBanner(false); setHub(true); syncHubUrl(true); };
 const closeHub=()=>{ setHub(false); syncHubUrl(false); };

 /* 步进副作用：自动前进 + 高亮 + 动作分发（高亮集中此处管理，切步先全量清理） */
 useEffect(()=>{
  if(story==null) return;
  document.querySelectorAll(".tour-active").forEach(el=>el.classList.remove("tour-active"));
  if(done) return;
  const sp=STORIES[story].steps[step];
  const tm=setTimeout(()=>next(),4200); timers.current.push(tm);
  const act=sp.act||"";
  if(act.startsWith("hl:")){
   const el=document.querySelector(`[data-tour="${act.slice(3)}"]`);
   if(el) el.classList.add("tour-active");
  }else if(act==="goto:expired"){ setViewOverride("expired"); }
  else if(act==="goto:disc"){ setViewOverride("disc"); }
  else if(act==="fastForward"){ setSpeed(60); }
  else if(act==="banner"){ setBanner(true); const b=setTimeout(()=>setBanner(false),2600); timers.current.push(b); }
  else{ window.dispatchEvent(new CustomEvent(ACTION_EV,{detail:act})); } // runCell / vllmRespond / comfyQueue
  return ()=>clearTimeout(tm);
 },[story,step,done]);

 /* 渲染路由：hub 优先 > 无 story → URL 直开路由（含 state=expired/disc 直开与 Hub）；有 story → 场景驱动 */
 const st = story!=null? STORIES[story] : null;
 let view;
 if(hub){ view="hub"; }
 else if(st){ view = viewOverride || st.view; }
 else if(P.state==="expired"||P.state==="disconnected"){ view=P.state; }
 else if(!P.sid){ view="hub"; }
 else{ view = P.tpl.includes("vLLM") ? "vllm" : (P.tpl.includes("ComfyUI") ? "comfy" : "jupyter"); }

 if(view==="hub") return (<><Hub onPick={pick} onResume={closeHub} canResume={!!(P.sid||story!=null)}/><Footer/></>);

 /* 有效参数：P 为加载时快照，story 进场经 replaceState 不重载——story 态用场景默认值兜底 */
 const eff = st? {
   sid: P.sid||"i-480221", gpu: P.gpu||"RTX 5080", ip: P.ip||"65.150.23.88", port: P.port||"45678", tpl: st.tpl,
  } : P;
 const skin = view==="vllm"? <VllmSkin ip={eff.ip} port={eff.port}/>
  : view==="comfy"? <ComfySkin/>
  : (view==="expired"||view==="disc")? <EndedSkin kind={view}/>
  : <JupyterSkin gpu={eff.gpu}/>;
 const showBar = story!=null;
 return (<>
  {banner && (
   <div className="fade-in fixed left-1/2 top-16 z-50 -translate-x-1/2 rounded-xl border border-[var(--color-warning)]/60 bg-[var(--color-warning)]/15 px-4 py-2 text-[13px] font-semibold text-[var(--color-warning-on-tint)] shadow-lg">
    {T.banner}</div>)}
  <TopBar remain={st? st.remain : P.remain} speed={speed} sid={eff.sid} gpu={eff.gpu} ip={eff.ip} port={eff.port} tpl={eff.tpl} onOpenHub={openHub}/>
  <main id="portal-main" tabIndex={-1} className="flex-1">{skin}</main>
  {showBar && <TourBar story={story} step={step} done={done} onPrev={prev} onNext={next} onExit={exit} onReplay={replay}/>}
  <Footer/>
 </>);
}

 </React.StrictMode>);
